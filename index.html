<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта России: субъекты и центры</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { width: 100%; height: 100vh; }

  /* Панель управления (слева вверху) */
  .controls {
    position: absolute; top: 20px; left: 60px; z-index: 1000;
    background: #fff; padding: 12px 16px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.15);
    display: flex; gap: 8px; align-items: center;
  }
  .mode-btn {
    padding: 8px 16px; border: 2px solid #d1d5db; background: #fff;
    color: #374151; font-size: 14px; font-weight: 600;
    border-radius: 8px; cursor: pointer; transition: all .15s;
  }
  .mode-btn:hover { border-color: #4f46e5; color: #4f46e5; }
  .mode-btn.active { background: #4f46e5; color: #fff; border-color: #4f46e5; }

  /* Панель информации (справа вверху) */
  .info-panel {
    position: absolute; top: 20px; right: 20px; z-index: 1000;
    background: #fff; padding: 18px 22px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.15); min-width: 260px;
    max-width: 340px; display: none;
  }
  .info-panel.visible { display: block; }
  .info-panel .label {
    font-size: 12px; color: #7f8c8d; text-transform: uppercase;
    letter-spacing: .5px; margin-bottom: 4px;
  }
  .info-panel h3 {
    margin: 0 0 14px 0; color: #2c3e50; font-size: 17px; line-height: 1.3;
  }
  .info-panel .center { font-size: 18px; color: #4f46e5; font-weight: 700; }
  .info-panel .close {
    position: absolute; top: 10px; right: 12px;
    background: none; border: none; font-size: 20px;
    cursor: pointer; color: #9ca3af; line-height: 1;
  }
  .info-panel .close:hover { color: #374151; }

  /* Панель теста (снизу по центру) */
  .quiz-panel {
    position: absolute; bottom: 30px; left: 50%; z-index: 1000;
    transform: translateX(-50%);
    background: #fff; padding: 18px 26px; border-radius: 14px;
    box-shadow: 0 6px 30px rgba(0,0,0,.2);
    min-width: 340px; max-width: 90vw;
    display: none; text-align: center;
  }
  .quiz-panel.visible { display: block; }
  .quiz-panel .question-label {
    font-size: 12px; color: #7f8c8d; text-transform: uppercase;
    letter-spacing: .5px; margin-bottom: 4px;
  }
  .quiz-panel .question {
    font-size: 22px; font-weight: 700; color: #2c3e50;
    margin-bottom: 10px; line-height: 1.3;
  }
  .quiz-panel .question span { color: #4f46e5; }
  .quiz-panel .progress {
    font-size: 13px; color: #6b7280;
  }
  .quiz-panel .progress-bar {
    height: 6px; background: #e5e7eb; border-radius: 99px;
    overflow: hidden; margin-top: 8px;
  }
  .quiz-panel .progress-bar > div {
    height: 100%; width: 0%; background: #4f46e5;
    transition: width .3s;
  }
  .quiz-panel .feedback {
    margin-top: 10px; font-weight: 600; min-height: 20px; font-size: 15px;
  }
  .quiz-panel .feedback.ok { color: #16a34a; }
  .quiz-panel .feedback.err { color: #dc2626; }
  .quiz-panel .restart-btn {
    margin-top: 12px; padding: 9px 20px;
    background: #4f46e5; color: #fff; border: none;
    border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  .quiz-panel .restart-btn:hover { opacity: .9; }

  /* Финальный результат */
  .quiz-result {
    display: none;
  }
  .quiz-result.visible { display: block; }
  .quiz-result .score {
    font-size: 42px; font-weight: 800; color: #4f46e5; margin: 8px 0;
  }
  .quiz-result .verdict {
    font-size: 15px; color: #374151; margin-bottom: 14px;
  }

  /* Легенда */
  .legend {
    position: absolute; bottom: 20px; left: 20px; z-index: 1000;
    background: rgba(255,255,255,.95); padding: 10px 14px;
    border-radius: 8px; font-size: 12px; color: #4b5563;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
    transition: opacity .3s;
  }
  .legend.hidden { opacity: 0; pointer-events: none; }

  .loading {
    position: absolute; top: 50%; left: 50%; z-index: 2000;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,.95); padding: 16px 24px;
    border-radius: 10px; font-size: 15px; color: #374151;
    box-shadow: 0 4px 16px rgba(0,0,0,.1);
  }
</style>
</head>
<body>

<div id="map"></div>
<div class="loading" id="loading">Загрузка карты…</div>

<!-- Переключатель режимов -->
<div class="controls">
  <button class="mode-btn active" data-mode="explore">🔍 Обзор</button>
  <button class="mode-btn" data-mode="quiz">🎯 Тест</button>
</div>

<!-- Панель информации (режим обзора) -->
<div class="info-panel" id="infoPanel">
  <button class="close" id="closeBtn">×</button>
  <div class="label">Регион</div>
  <h3 id="regionName">—</h3>
  <div class="label">Административный центр</div>
  <div class="center" id="regionCenter">—</div>
</div>

<!-- Панель теста -->
<div class="quiz-panel" id="quizPanel">
  <div id="quizBody">
    <div class="question-label">Найди на карте</div>
    <div class="question" id="quizQuestion">—</div>
    <div class="feedback" id="quizFeedback"></div>
    <div class="progress" id="quizProgress">Вопрос 1 из 89</div>
    <div class="progress-bar"><div id="quizBar"></div></div>
  </div>

  <div class="quiz-result" id="quizResult">
    <div class="question-label">Результат</div>
    <div class="score" id="quizScore">0 / 89</div>
    <div class="verdict" id="quizVerdict"></div>
    <button class="restart-btn" id="quizRestart">Пройти заново</button>
  </div>
</div>

<div class="legend" id="legend">Кликни по региону, чтобы увидеть центр</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
/* ============================================================
   СЛОВАРЬ ЦЕНТРОВ для регионов с пустым полем capital
   ============================================================ */
const FALLBACK_CENTERS = {
  "Ненецкий автономный округ": "Нарьян-Мар",
  "Ханты-Мансийский автономный округ — Югра": "Ханты-Мансийск",
  "Чукотский автономный округ": "Анадырь",
  "Ямало-Ненецкий автономный округ": "Салехард",
  "Еврейская автономная область": "Биробиджан",
  "Кемеровская область": "Кемерово",
  // На случай, если в данных где-то ещё пусто:
  "Кемеровская область — Кузбасс": "Кемерово",
  "Республика Крым": "Симферополь",
  "Севастополь": "Севастополь",
  "Донецкая Народная Республика": "Донецк",
  "Луганская Народная Республика": "Луганск",
  "Запорожская область": "Мелитополь",
  "Херсонская область": "Геническ"
};

/* ============================================================
   Карта
   ============================================================ */
const map = L.map('map', {
  center: [61.5, 100],
  zoom: 3,
  minZoom: 2,
  maxZoom: 8,
  zoomControl: true
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CartoDB',
  maxZoom: 19
}).addTo(map);

/* ============================================================
   Стили
   ============================================================ */
const defaultStyle  = { fillColor: "#e0e7ff", weight: 1,   opacity: 1,   color: "#4f46e5", fillOpacity: 0.5  };
const hoverStyle    = { fillColor: "#c7d2fe", weight: 2,   color: "#4f46e5", fillOpacity: 0.7  };
const selectedStyle = { fillColor: "#a5b4fc", weight: 2.5, color: "#4338ca", fillOpacity: 0.85 };
const correctStyle  = { fillColor: "#86efac", weight: 2.5, color: "#16a34a", fillOpacity: 0.85 };
const wrongStyle    = { fillColor: "#fca5a5", weight: 2.5, color: "#dc2626", fillOpacity: 0.85 };

/* ============================================================
   Состояние
   ============================================================ */
let layersByName = {};      // { название региона: L.geoJSON слой }
let selectedLayer = null;   // текущий выделенный (режим обзора)
let currentMode = 'explore';

/* Режим теста */
let quizQueue = [];         // перемешанный список регионов
let quizIndex = 0;
let quizCorrect = 0;
let quizLocked = false;     // блокировка клика во время показа ответа

/* ============================================================
   DOM
   ============================================================ */
const infoPanel     = document.getElementById('infoPanel');
const regionNameEl  = document.getElementById('regionName');
const regionCenterEl= document.getElementById('regionCenter');
const quizPanel     = document.getElementById('quizPanel');
const quizBody      = document.getElementById('quizBody');
const quizResult    = document.getElementById('quizResult');
const quizQuestion  = document.getElementById('quizQuestion');
const quizFeedback  = document.getElementById('quizFeedback');
const quizProgress  = document.getElementById('quizProgress');
const quizBar       = document.getElementById('quizBar');
const quizScore     = document.getElementById('quizScore');
const quizVerdict   = document.getElementById('quizVerdict');
const legend        = document.getElementById('legend');

document.getElementById('closeBtn').addEventListener('click', () => {
  infoPanel.classList.remove('visible');
  if (selectedLayer) { selectedLayer.setStyle(defaultStyle); selectedLayer = null; }
});

/* ============================================================
   Получить центр для региона
   ============================================================ */
function getCenter(props) {
  // 1) capital из TopoJSON
  if (props.capital && props.capital.trim() !== '') return props.capital;
  // 2) fallback-словарь
  if (FALLBACK_CENTERS[props.name]) return FALLBACK_CENTERS[props.name];
  // 3) поиск по частичному совпадению
  for (const key in FALLBACK_CENTERS) {
    if (props.name && props.name.includes(key)) return FALLBACK_CENTERS[key];
  }
  return '—';
}

/* ============================================================
   Загрузка TopoJSON
   ============================================================ */
fetch('ru-subjects-contour.topojson')
  .then(r => r.json())
  .then(topo => {
    document.getElementById('loading').remove();

    const geojson = topojson.feature(topo, topo.objects.ru_subjects);

    L.geoJSON(geojson, {
      style: defaultStyle,
      onEachFeature: (feature, layer) => {
        const props = feature.properties || {};
        const name = props.name || 'Неизвестный регион';

        layersByName[name] = layer;

        layer.bindTooltip(name, { sticky: true, direction: 'top' });

        layer.on('mouseover', () => {
          if (currentMode === 'explore') {
            if (selectedLayer !== layer) layer.setStyle(hoverStyle);
          } else if (currentMode === 'quiz' && !quizLocked) {
            layer.setStyle(hoverStyle);
          }
        });

        layer.on('mouseout', () => {
          if (currentMode === 'explore') {
            if (selectedLayer !== layer) layer.setStyle(defaultStyle);
          } else if (currentMode === 'quiz' && !quizLocked) {
            layer.setStyle(defaultStyle);
          }
        });

        layer.on('click', () => {
          if (currentMode === 'explore') {
            handleExploreClick(layer, props);
          } else if (currentMode === 'quiz') {
            handleQuizClick(layer, name);
          }
        });
      }
    }).addTo(map);
  })
  .catch(err => {
    console.error('Ошибка загрузки:', err);
    document.getElementById('loading').textContent =
      'Не удалось загрузить ru-subjects-contour.topojson. Файл должен лежать рядом с index.html.';
  });

/* ============================================================
   РЕЖИМ ОБЗОРА
   ============================================================ */
function handleExploreClick(layer, props) {
  if (selectedLayer && selectedLayer !== layer) {
    selectedLayer.setStyle(defaultStyle);
  }
  layer.setStyle(selectedStyle);
  selectedLayer = layer;

  regionNameEl.textContent = props.name || 'Неизвестный регион';
  regionCenterEl.textContent = getCenter(props);
  infoPanel.classList.add('visible');

  map.fitBounds(layer.getBounds(), { padding: [40, 40], maxZoom: 7 });
}

/* ============================================================
   РЕЖИМ ТЕСТА
   ============================================================ */
function startQuiz() {
  quizQueue = Object.keys(layersByName);
  // Перемешать
  for (let i = quizQueue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quizQueue[i], quizQueue[j]] = [quizQueue[j], quizQueue[i]];
  }
  quizIndex = 0;
  quizCorrect = 0;
  quizLocked = false;

  quizBody.style.display = 'block';
  quizResult.classList.remove('visible');
  quizFeedback.textContent = '';
  quizFeedback.className = 'feedback';

  // Сбросить стили всех слоёв
  Object.values(layersByName).forEach(l => l.setStyle(defaultStyle));
  if (selectedLayer) { selectedLayer = null; }

  infoPanel.classList.remove('visible');
  legend.classList.add('hidden');

  showQuestion();
}

function showQuestion() {
  if (quizIndex >= quizQueue.length) {
    finishQuiz();
    return;
  }
  const regionName = quizQueue[quizIndex];
  quizQuestion.innerHTML = `«<span>${regionName}</span>»`;
  quizFeedback.textContent = '';
  quizFeedback.className = 'feedback';
  quizProgress.textContent = `Вопрос ${quizIndex + 1} из ${quizQueue.length}`;
  quizBar.style.width = (quizIndex / quizQueue.length * 100) + '%';
  quizLocked = false;
}

function handleQuizClick(layer, clickedName) {
  if (quizLocked) return;
  const targetName = quizQueue[quizIndex];

  if (clickedName === targetName) {
    // Верно
    quizCorrect++;
    quizFeedback.textContent = '✅ Верно!';
    quizFeedback.className = 'feedback ok';
    layer.setStyle(correctStyle);
    map.fitBounds(layer.getBounds(), { padding: [40, 40], maxZoom: 7 });
  } else {
    // Неверно
    quizFeedback.textContent = `❌ Неверно. Правильный ответ: ${targetName}`;
    quizFeedback.className = 'feedback err';
    layer.setStyle(wrongStyle);
    const correctLayer = layersByName[targetName];
    if (correctLayer) {
      correctLayer.setStyle(correctStyle);
      map.fitBounds(correctLayer.getBounds(), { padding: [40, 40], maxZoom: 7 });
    }
  }

  quizLocked = true;

  setTimeout(() => {
    // Сбросить стили
    Object.values(layersByName).forEach(l => l.setStyle(defaultStyle));
    quizIndex++;
    showQuestion();
  }, 1600);
}

function finishQuiz() {
  quizBar.style.width = '100%';
  quizBody.style.display = 'none';
  quizResult.classList.add('visible');

  const total = quizQueue.length;
  const percent = Math.round(quizCorrect / total * 100);
  quizScore.textContent = `${quizCorrect} / ${total}`;

  if (percent === 100)      quizVerdict.textContent = '🏆 Идеально! Все регионы найдены.';
  else if (percent >= 80)   quizVerdict.textContent = '👍 Отлично! Есть что подтянуть.';
  else if (percent >= 50)   quizVerdict.textContent = '📚 Неплохо, но стоит повторить.';
  else                      quizVerdict.textContent = '💪 Нужно ещё потренироваться.';
}

/* ============================================================
   Переключение режимов
   ============================================================ */
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const mode = btn.dataset.mode;

    if (mode === currentMode) return;
    currentMode = mode;

    // Сброс общего состояния
    infoPanel.classList.remove('visible');
    if (selectedLayer) { selectedLayer.setStyle(defaultStyle); selectedLayer = null; }

    if (mode === 'explore') {
      quizPanel.classList.remove('visible');
      legend.classList.remove('hidden');
      Object.values(layersByName).forEach(l => l.setStyle(defaultStyle));
      map.setView([61.5, 100], 3);
    } else if (mode === 'quiz') {
      quizPanel.classList.add('visible');
      legend.classList.add('hidden');
      startQuiz();
    }
  });
});

/* Кнопка «Пройти заново» */
document.getElementById('quizRestart').addEventListener('click', startQuiz);
</script>
</body>
</html>
