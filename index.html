<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта России: субъекты и центры (атласная проекция)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }

  #map-container {
    position: absolute; inset: 0;
    background: #f8fafc;
  }
  svg { display: block; width: 100%; height: 100%; cursor: grab; }
  svg:active { cursor: grabbing; }

  /* Регионы */
  .region {
    fill: #dbeafe;
    stroke: #4f46e5;
    stroke-width: 0.6;
    transition: fill .15s;
    cursor: pointer;
  }
  .region:hover { fill: #bfdbfe; }
  .region.selected { fill: #a5b4fc; stroke: #4338ca; stroke-width: 1.2; }
  .region.correct  { fill: #86efac; stroke: #16a34a; stroke-width: 1.2; }
  .region.wrong    { fill: #fca5a5; stroke: #dc2626; stroke-width: 1.2; }

  /* Панель управления (слева вверху) */
  .controls {
    position: absolute; top: 20px; left: 20px; z-index: 100;
    background: #fff; padding: 12px 16px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.15);
    display: flex; gap: 8px;
  }
  .mode-btn {
    padding: 8px 16px; border: 2px solid #d1d5db; background: #fff;
    color: #374151; font-size: 14px; font-weight: 600;
    border-radius: 8px; cursor: pointer; transition: all .15s;
  }
  .mode-btn:hover { border-color: #4f46e5; color: #4f46e5; }
  .mode-btn.active { background: #4f46e5; color: #fff; border-color: #4f46e5; }

  /* Панель информации (справа вверху) */
  .info-panel {
    position: absolute; top: 20px; right: 20px; z-index: 100;
    background: #fff; padding: 18px 22px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.15); min-width: 260px;
    max-width: 340px; display: none;
  }
  .info-panel.visible { display: block; }
  .info-panel .label {
    font-size: 12px; color: #7f8c8d; text-transform: uppercase;
    letter-spacing: .5px; margin-bottom: 4px;
  }
  .info-panel h3 {
    margin: 0 0 14px 0; color: #2c3e50; font-size: 17px; line-height: 1.3;
  }
  .info-panel .center { font-size: 18px; color: #4f46e5; font-weight: 700; }
  .info-panel .close {
    position: absolute; top: 10px; right: 12px;
    background: none; border: none; font-size: 20px;
    cursor: pointer; color: #9ca3af;
  }
  .info-panel .close:hover { color: #374151; }

  /* Панель теста */
  .quiz-panel {
    position: absolute; bottom: 30px; left: 50%; z-index: 100;
    transform: translateX(-50%);
    background: #fff; padding: 18px 26px; border-radius: 14px;
    box-shadow: 0 6px 30px rgba(0,0,0,.2);
    min-width: 340px; max-width: 90vw;
    display: none; text-align: center;
  }
  .quiz-panel.visible { display: block; }
  .quiz-panel .question-label {
    font-size: 12px; color: #7f8c8d; text-transform: uppercase;
    letter-spacing: .5px; margin-bottom: 4px;
  }
  .quiz-panel .question {
    font-size: 22px; font-weight: 700; color: #2c3e50;
    margin-bottom: 10px;
  }
  .quiz-panel .question span { color: #4f46e5; }
  .quiz-panel .progress { font-size: 13px; color: #6b7280; }
  .quiz-panel .progress-bar {
    height: 6px; background: #e5e7eb; border-radius: 99px;
    overflow: hidden; margin-top: 8px;
  }
  .quiz-panel .progress-bar > div {
    height: 100%; width: 0%; background: #4f46e5; transition: width .3s;
  }
  .quiz-panel .feedback {
    margin-top: 10px; font-weight: 600; min-height: 20px; font-size: 15px;
  }
  .quiz-panel .feedback.ok { color: #16a34a; }
  .quiz-panel .feedback.err { color: #dc2626; }
  .quiz-panel .restart-btn {
    margin-top: 12px; padding: 9px 20px; background: #4f46e5;
    color: #fff; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .quiz-panel .restart-btn:hover { opacity: .9; }
  .quiz-result { display: none; }
  .quiz-result.visible { display: block; }
  .quiz-result .score {
    font-size: 42px; font-weight: 800; color: #4f46e5; margin: 8px 0;
  }
  .quiz-result .verdict {
    font-size: 15px; color: #374151; margin-bottom: 14px;
  }

  .legend {
    position: absolute; bottom: 20px; left: 20px; z-index: 100;
    background: rgba(255,255,255,.95); padding: 10px 14px;
    border-radius: 8px; font-size: 12px; color: #4b5563;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
    transition: opacity .3s;
  }
  .legend.hidden { opacity: 0; pointer-events: none; }

  .loading {
    position: absolute; top: 50%; left: 50%; z-index: 2000;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,.95); padding: 16px 24px;
    border-radius: 10px; font-size: 15px; color: #374151;
    box-shadow: 0 4px 16px rgba(0,0,0,.1);
  }
</style>
</head>
<body>

<div id="map-container">
  <svg id="map"></svg>
</div>

<div class="loading" id="loading">Загрузка карты…</div>

<div class="controls">
  <button class="mode-btn active" data-mode="explore">🔍 Обзор</button>
  <button class="mode-btn" data-mode="quiz">🎯 Тест</button>
</div>

<div class="info-panel" id="infoPanel">
  <button class="close" id="closeBtn">×</button>
  <div class="label">Регион</div>
  <h3 id="regionName">—</h3>
  <div class="label">Административный центр</div>
  <div class="center" id="regionCenter">—</div>
</div>

<div class="quiz-panel" id="quizPanel">
  <div id="quizBody">
    <div class="question-label">Найди на карте</div>
    <div class="question" id="quizQuestion">—</div>
    <div class="feedback" id="quizFeedback"></div>
    <div class="progress" id="quizProgress">Вопрос 1 из 89</div>
    <div class="progress-bar"><div id="quizBar"></div></div>
  </div>
  <div class="quiz-result" id="quizResult">
    <div class="question-label">Результат</div>
    <div class="score" id="quizScore">0 / 89</div>
    <div class="verdict" id="quizVerdict"></div>
    <button class="restart-btn" id="quizRestart">Пройти заново</button>
  </div>
</div>

<div class="legend" id="legend">Кликни по региону → увидишь центр. Колесо — зум.</div>

<script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
<script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
/* ============================================================
   Словарь центров для регионов с пустым capital
   ============================================================ */
const FALLBACK_CENTERS = {
  "Ненецкий автономный округ": "Нарьян-Мар",
  "Ханты-Мансийский автономный округ — Югра": "Ханты-Мансийск",
  "Чукотский автономный округ": "Анадырь",
  "Ямало-Ненецкий автономный округ": "Салехард",
  "Еврейская автономная область": "Биробиджан",
  "Кемеровская область": "Кемерово",
  "Кемеровская область — Кузбасс": "Кемерово",
  "Республика Крым": "Симферополь",
  "Севастополь": "Севастополь",
  "Донецкая Народная Республика": "Донецк",
  "Луганская Народная Республика": "Луганск",
  "Запорожская область": "Мелитополь",
  "Херсонская область": "Геническ"
};

function getCenter(props) {
  if (props.capital && props.capital.trim() !== "") return props.capital;
  if (FALLBACK_CENTERS[props.name]) return FALLBACK_CENTERS[props.name];
  for (const key in FALLBACK_CENTERS) {
    if (props.name && props.name.includes(key)) return FALLBACK_CENTERS[key];
  }
  return "—";
}

/* ============================================================
   Настройка SVG и проекции
   ============================================================ */
const svg = d3.select("#map");
const g = svg.append("g");

const width = window.innerWidth;
const height = window.innerHeight;

// Атласная (коническая равновеликая) проекция под Россию
const projection = d3.geoAlbers()
  .rotate([-105, 0])        // поворот: центр России ~105° в.д.
  .center([-10, 65])        // смещение центра карты
  .parallels([52, 64])      // стандартные параллели
  .scale(700)
  .translate([width / 2, height / 2]);

const path = d3.geoPath().projection(projection);

/* ============================================================
   Зум и перетаскивание
   ============================================================ */
const zoom = d3.zoom()
  .scaleExtent([0.8, 12])
  .on("zoom", (event) => {
    g.attr("transform", event.transform);
  });

svg.call(zoom);

/* ============================================================
   Состояние
   ============================================================ */
let regionsData = [];       // [{name, capital, feature, node}]
let byName = {};            // name -> region object
let selectedRegion = null;  // для режима обзора
let currentMode = "explore";

/* Режим теста */
let quizQueue = [];
let quizIndex = 0;
let quizCorrect = 0;
let quizLocked = false;

/* ============================================================
   DOM
   ============================================================ */
const infoPanel = document.getElementById("infoPanel");
const regionNameEl = document.getElementById("regionName");
const regionCenterEl = document.getElementById("regionCenter");
const quizPanel = document.getElementById("quizPanel");
const quizBody = document.getElementById("quizBody");
const quizResult = document.getElementById("quizResult");
const quizQuestion = document.getElementById("quizQuestion");
const quizFeedback = document.getElementById("quizFeedback");
const quizProgress = document.getElementById("quizProgress");
const quizBar = document.getElementById("quizBar");
const quizScore = document.getElementById("quizScore");
const quizVerdict = document.getElementById("quizVerdict");
const legend = document.getElementById("legend");

document.getElementById("closeBtn").addEventListener("click", () => {
  infoPanel.classList.remove("visible");
  if (selectedRegion) {
    selectedRegion.node.classList.remove("selected");
    selectedRegion = null;
  }
});

/* ============================================================
   Загрузка TopoJSON
   ============================================================ */
fetch("ru-subjects-contour.topojson")
  .then(r => r.json())
  .then(topo => {
    document.getElementById("loading").remove();

    const geojson = topojson.feature(topo, topo.objects.ru_subjects);

    // Собираем данные
    regionsData = geojson.features.map(f => ({
      name: f.properties.name,
      capital: getCenter(f.properties),
      feature: f,
      node: null
    }));
    byName = {};
    regionsData.forEach(r => byName[r.name] = r);

    // Рисуем все регионы
    g.selectAll("path.region")
      .data(regionsData)
      .join("path")
      .attr("class", "region")
      .attr("d", d => path(d.feature))
      .each(function (d) {
        d.node = this;   // сохраняем DOM-узел
      })
      .on("click", (event, d) => {
        event.stopPropagation();
        if (currentMode === "explore") handleExploreClick(d);
        else if (currentMode === "quiz") handleQuizClick(d);
      })
      .on("mouseenter", (event, d) => {
        if (currentMode === "explore" && selectedRegion !== d) {
          d3.select(d.node).attr("fill", "#bfdbfe");
        } else if (currentMode === "quiz" && !quizLocked) {
          d3.select(d.node).attr("fill", "#bfdbfe");
        }
      })
      .on("mouseleave", (event, d) => {
        if (currentMode === "explore" && selectedRegion !== d) {
          d3.select(d.node).attr("fill", null);
        } else if (currentMode === "quiz" && !quizLocked) {
          d3.select(d.node).attr("fill", null);
        }
      });

    // Подгоняем карту под размер окна
    fitAllRegions();
  })
  .catch(err => {
    console.error(err);
    document.getElementById("loading").textContent =
      "Не удалось загрузить ru-subjects-contour.topojson. Проверь, что файл рядом с index.html.";
  });

/* ============================================================
   Подгонка карты
   ============================================================ */
function fitAllRegions() {
  const bounds = path.bounds({
    type: "FeatureCollection",
    features: regionsData.map(r => r.feature)
  });
  const dx = bounds[1][0] - bounds[0][0];
  const dy = bounds[1][1] - bounds[0][1];
  const x = (bounds[0][0] + bounds[1][0]) / 2;
  const y = (bounds[0][1] + bounds[1][1]) / 2;
  const scale = 0.92 / Math.max(dx / width, dy / height);
  const translate = [width / 2 - scale * x, height / 2 - scale * y];

  svg.transition().duration(500).call(
    zoom.transform,
    d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale)
  );
}

function fitToFeature(feature) {
  const bounds = path.bounds(feature);
  const dx = bounds[1][0] - bounds[0][0];
  const dy = bounds[1][1] - bounds[0][1];
  const x = (bounds[0][0] + bounds[1][0]) / 2;
  const y = (bounds[0][1] + bounds[1][1]) / 2;
  const scale = 0.6 / Math.max(dx / width, dy / height);
  const translate = [width / 2 - scale * x, height / 2 - scale * y];

  svg.transition().duration(700).call(
    zoom.transform,
    d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale)
  );
}

/* ============================================================
   Режим обзора
   ============================================================ */
function handleExploreClick(d) {
  if (selectedRegion && selectedRegion !== d) {
    selectedRegion.node.classList.remove("selected");
  }
  d.node.classList.add("selected");
  selectedRegion = d;

  regionNameEl.textContent = d.name;
  regionCenterEl.textContent = d.capital;
  infoPanel.classList.add("visible");

  fitToFeature(d.feature);
}

/* ============================================================
   Режим теста
   ============================================================ */
function startQuiz() {
  quizQueue = regionsData.slice();
  for (let i = quizQueue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quizQueue[i], quizQueue[j]] = [quizQueue[j], quizQueue[i]];
  }
  quizIndex = 0;
  quizCorrect = 0;
  quizLocked = false;

  quizBody.style.display = "block";
  quizResult.classList.remove("visible");
  quizFeedback.textContent = "";
  quizFeedback.className = "feedback";

  regionsData.forEach(r => {
    r.node.classList.remove("selected", "correct", "wrong");
  });
  selectedRegion = null;
  infoPanel.classList.remove("visible");
  legend.classList.add("hidden");

  fitAllRegions();
  showQuestion();
}

function showQuestion() {
  if (quizIndex >= quizQueue.length) return finishQuiz();
  const r = quizQueue[quizIndex];
  quizQuestion.innerHTML = `«<span>${r.name}</span>»`;
  quizFeedback.textContent = "";
  quizFeedback.className = "feedback";
  quizProgress.textContent = `Вопрос ${quizIndex + 1} из ${quizQueue.length}`;
  quizBar.style.width = (quizIndex / quizQueue.length * 100) + "%";
  quizLocked = false;
}

function handleQuizClick(d) {
  if (quizLocked) return;
  const target = quizQueue[quizIndex];

  if (d === target) {
    quizCorrect++;
    d.node.classList.add("correct");
    quizFeedback.textContent = "✅ Верно!";
    quizFeedback.className = "feedback ok";
    fitToFeature(d.feature);
  } else {
    d.node.classList.add("wrong");
    target.node.classList.add("correct");
    quizFeedback.textContent = `❌ Неверно. Правильный ответ: ${target.name}`;
    quizFeedback.className = "feedback err";
    fitToFeature(target.feature);
  }

  quizLocked = true;
  setTimeout(() => {
    regionsData.forEach(r => r.node.classList.remove("correct", "wrong"));
    quizIndex++;
    showQuestion();
  }, 1600);
}

function finishQuiz() {
  quizBar.style.width = "100%";
  quizBody.style.display = "none";
  quizResult.classList.add("visible");

  const total = quizQueue.length;
  const percent = Math.round(quizCorrect / total * 100);
  quizScore.textContent = `${quizCorrect} / ${total}`;

  if (percent === 100)    quizVerdict.textContent = "🏆 Идеально!";
  else if (percent >= 80) quizVerdict.textContent = "👍 Отлично!";
  else if (percent >= 50) quizVerdict.textContent = "📚 Неплохо, но повтори.";
  else                    quizVerdict.textContent = "💪 Нужно ещё тренироваться.";

  fitAllRegions();
}

/* ============================================================
   Переключение режимов
   ============================================================ */
document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const mode = btn.dataset.mode;
    if (mode === currentMode) return;
    currentMode = mode;

    infoPanel.classList.remove("visible");
    if (selectedRegion) {
      selectedRegion.node.classList.remove("selected");
      selectedRegion = null;
    }

    if (mode === "explore") {
      quizPanel.classList.remove("visible");
      legend.classList.remove("hidden");
      regionsData.forEach(r => r.node.classList.remove("correct", "wrong"));
      fitAllRegions();
    } else {
      quizPanel.classList.add("visible");
      legend.classList.add("hidden");
      startQuiz();
    }
  });
});

document.getElementById("quizRestart").addEventListener("click", startQuiz);

/* ============================================================
   Пересчёт при изменении размера окна
   ============================================================ */
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    svg.attr("viewBox", `0 0 ${w} ${h}`);
  }, 200);
});
</script>
</body>
</html>
